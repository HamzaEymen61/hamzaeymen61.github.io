<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Akıllı Ev">
  <title>Akıllı Ev</title>
  <link rel="apple-touch-icon" href="https://github.com/HamzaEymen61/foto/raw/main/icon-192.png">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    :root {
      --bg-color: #0d0d0f;
      --bg-gradient: radial-gradient(circle at 50% 0%, #19191d 0%, #0d0d0f 65%);
      --card-bg: #151518;
      --card-bg-on: #1a1a1f;
      --card-border: rgba(255, 255, 255, 0.06);
      --card-border-on: rgba(255, 255, 255, 0.16);
      --text: #ffffff;
      --text-muted: #787880;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-color);
      background-image: var(--bg-gradient);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: flex;
      justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .app {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      padding: 20px 22px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-top: 12px;
      flex-shrink: 0;
    }

    .live-time {
      font-size: 52px;
      font-weight: 300;
      letter-spacing: -1.5px;
      color: #ffffff;
      line-height: 1;
    }

    .greeting-text {
      font-size: 15px;
      font-weight: 500;
      color: #ffffff;
      margin-top: 8px;
      opacity: 0.92;
    }

    .live-date {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: capitalize;
    }

    .version-tag {
      font-size: 10px;
      color: var(--text-muted);
      opacity: 0.55;
      margin-top: 3px;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      margin: 12px 0;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
      padding-left: 2px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .led-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 18px;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.25s, border-color 0.25s, opacity 0.25s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      height: 122px;
      position: relative;
      overflow: hidden;
      touch-action: manipulation;
    }

    .led-card * {
      pointer-events: none;
    }

    .led-card.pressing {
      transform: scale(0.96);
    }

    .led-card::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      height: 3px;
      width: 0;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 0 3px 3px 0;
    }

    .led-card.pressing::after {
      width: 100%;
      transition: width 1s linear;
    }

    .led-card.on {
      background: var(--card-bg-on);
      border-color: var(--card-border-on);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .led-card.on.offline {
      opacity: 0.55;
      border-color: rgba(255, 255, 255, 0.08);
      box-shadow: none;
    }

    .led-card.offline {
      opacity: 0.38;
    }

    .led-card.loading {
      opacity: 0.5;
      pointer-events: none;
    }

    .led-card-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .led-icon {
      font-size: 26px;
      line-height: 1;
      transition: transform 0.25s ease;
    }

    .led-card.on .led-icon {
      transform: scale(1.05);
    }

    .top-right-indicators {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .offline-badge {
      font-size: 11px;
      opacity: 0.75;
      display: none;
    }

    .led-card.offline .offline-badge {
      display: inline-block;
    }

    .led-status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      margin-top: 4px;
      transition: all 0.25s ease;
    }

    .led-card.on:not(.offline) .led-status-dot {
      background: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
    }

    .led-card-bottom {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .led-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: -0.2px;
      transition: color 0.25s ease;
    }

    .led-card.on .led-name {
      color: #ffffff;
    }

    .led-status-text {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .led-card.on .led-status-text {
      color: rgba(255, 255, 255, 0.85);
    }

    .footer-controls {
      flex-shrink: 0;
    }

    .all-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .all-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      padding: 16px 12px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      touch-action: manipulation;
    }

    .all-btn:active {
      transform: scale(0.96);
      background: #1d1d22;
    }

    .toast {
      position: fixed;
      bottom: calc(28px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(90px);
      background: #1c1c21;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 99px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 500;
      padding: 11px 22px;
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.1), opacity 0.25s;
      opacity: 0;
      z-index: 99;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.error {
      border-color: rgba(248, 113, 113, 0.35);
      color: #f87171;
    }

    /* Zorla menüsü (bottom sheet) */
    .force-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 100;
    }

    .force-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .force-sheet {
      position: fixed;
      left: 50%;
      bottom: 0;
      width: 100%;
      max-width: 430px;
      transform: translate(-50%, 100%);
      background: #18181c;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 26px 26px 0 0;
      padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 101;
    }

    .force-overlay.show .force-sheet {
      transform: translate(-50%, 0);
    }

    .force-title {
      font-size: 16px;
      font-weight: 600;
      text-align: center;
    }

    .force-sub {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin: 4px 0 18px;
    }

    .force-btn {
      width: 100%;
      border: 1px solid var(--card-border);
      background: #222228;
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      padding: 15px;
      border-radius: 16px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .force-btn:active {
      transform: scale(0.98);
    }

    .force-btn.on {
      border-color: rgba(255, 255, 255, 0.25);
    }

    .force-btn.off {
      border-color: rgba(248, 113, 113, 0.3);
      color: #f87171;
    }

    .force-btn.cancel {
      background: transparent;
      border-color: transparent;
      color: var(--text-muted);
      margin-bottom: 0;
    }

    /* Küçük ekranlı telefonlar için otomatik sıkılaştırma */
    @media (max-height: 700px) {
      .live-time { font-size: 42px; }
      .led-card { height: 104px; padding: 14px; border-radius: 20px; }
      .grid { gap: 10px; }
      .all-btn { padding: 13px 10px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="live-time" id="liveTime">22:36</div>
    <div class="greeting-text" id="greetingText">İyi Geceler</div>
    <div class="live-date" id="liveDate">18 Kasım Çarşamba</div>
    <div class="version-tag">sürüm: uzun-basma-1sn</div>
  </header>

  <div class="main-content">
    <p class="section-label">ODALAR</p>
    <div class="grid" id="ledGrid"></div>
  </div>

  <div class="footer-controls">
    <p class="section-label">MERKEZİ SENARYOLAR</p>
    <div class="all-controls">
      <button class="all-btn" onclick="allLeds('on')">✦ Tümünü Aç</button>
      <button class="all-btn" onclick="allLeds('off')">✕ Tümünü Kapat</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="force-overlay" id="forceOverlay">
  <div class="force-sheet">
    <div class="force-title" id="forceTitle">Oda</div>
    <div class="force-sub">Mevcut durum yok sayılarak komut gönderilir</div>
    <button class="force-btn on" onclick="forceSet('on')">⚡ Zorla Aç</button>
    <button class="force-btn off" onclick="forceSet('off')">⛔ Zorla Kapat</button>
    <button class="force-btn cancel" onclick="closeForceMenu()">İptal</button>
  </div>
</div>

<script>
  const LEDS = [
    { id: 'led1', name: 'Hamza Oda',   host: 'hamza-oda.local',   icon: '🛏️' },
    { id: 'led2', name: 'Salon',       host: 'salon.local',       icon: '🛋️' },
    { id: 'led3', name: 'Mutfak',      host: 'mutfak.local',      icon: '🍽️' },
    { id: 'led4', name: 'Ravza Oda',   host: 'ravza-oda.local',   icon: '🌸' },
    { id: 'led5', name: 'Yatak Odası', host: 'yatak-odasi.local', icon: '🌙' },
  ];

  const FETCH_TIMEOUT_MS = 3000;
  const state = {};
  const networkStatus = {};

  function loadStoredState() {
    try {
      return JSON.parse(localStorage.getItem('smarthome_state')) || {};
    } catch (e) {
      return {};
    }
  }

  const savedState = loadStoredState();
  LEDS.forEach(l => {
    state[l.id] = savedState[l.id] !== undefined ? savedState[l.id] : false;
    networkStatus[l.id] = null;
  });

  function saveToStorage() {
    try {
      localStorage.setItem('smarthome_state', JSON.stringify(state));
    } catch (e) {}
  }

  function fetchWithTimeout(url, timeoutMs) {
    return new Promise((resolve, reject) => {
      const controller = new AbortController();
      const timer = setTimeout(() => {
        controller.abort();
        reject(new Error('timeout'));
      }, timeoutMs);

      fetch(url, { signal: controller.signal })
        .then(res => { clearTimeout(timer); resolve(res); })
        .catch(err => { clearTimeout(timer); reject(err); });
    });
  }

  function updateClockAndUI() {
    const now = new Date();
    const hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('liveTime').textContent = `${String(hours).padStart(2, '0')}:${minutes}`;

    const options = { day: 'numeric', month: 'long', weekday: 'long' };
    document.getElementById('liveDate').textContent = now.toLocaleDateString('tr-TR', options);

    let greeting = 'İyi Geceler';
    if (hours >= 5 && hours < 12) greeting = 'Günaydın';
    else if (hours >= 12 && hours < 17) greeting = 'Tünaydın';
    else if (hours >= 17 && hours < 22) greeting = 'İyi Akşamlar';
    document.getElementById('greetingText').textContent = greeting;
  }

  const HOLD_MS = 1000;
  const MOVE_TOLERANCE = 14;

  let isHolding = false;
  let pendingRender = false;
  let holdTimer = null;
  let holdFired = false;
  let holdCard = null;
  let holdLed = null;
  let startX = 0, startY = 0;
  let forceTarget = null;

  function renderCards() {
    if (isHolding) { pendingRender = true; return; }
    pendingRender = false;

    const grid = document.getElementById('ledGrid');
    grid.innerHTML = '';
    LEDS.forEach(led => {
      const isOn = state[led.id];
      const isOnline = networkStatus[led.id];
      const isOffline = isOnline === false;

      const card = document.createElement('div');
      let cls = 'led-card';
      if (isOn) cls += ' on';
      if (isOffline) cls += ' offline';
      card.className = cls;
      card.id = 'card-' + led.id;

      let statusText;
      if (isOffline) {
        statusText = isOn ? 'Açık (çevrimdışı)' : 'Ulaşılamıyor';
      } else {
        statusText = isOn ? 'Açık' : 'Kapalı';
      }

      card.innerHTML = `
        <div class="led-card-top">
          <span class="led-icon">${led.icon}</span>
          <div class="top-right-indicators">
            <span class="offline-badge">⚠️</span>
            <div class="led-status-dot"></div>
          </div>
        </div>
        <div class="led-card-bottom">
          <div class="led-name">${led.name}</div>
          <div class="led-status-text">${statusText}</div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  async function checkAllStatuses() {
    await Promise.all(LEDS.map(async (led) => {
      try {
        const res = await fetchWithTimeout(`http://${led.host}/status`, FETCH_TIMEOUT_MS);
        const data = await res.json();
        state[led.id] = data.status === 'on';
        networkStatus[led.id] = true;
      } catch {
        networkStatus[led.id] = false;
      }
    }));
    saveToStorage();
    renderCards();
  }

  async function toggle(led) {
    const action = state[led.id] ? 'off' : 'on';
    const card = document.getElementById('card-' + led.id);
    if (card) card.classList.add('loading');

    try {
      await fetchWithTimeout(`http://${led.host}/led1/${action}`, FETCH_TIMEOUT_MS);
      state[led.id] = !state[led.id];
      networkStatus[led.id] = true;
      saveToStorage();
      renderCards();
      showToast(`${led.name} ${state[led.id] ? 'açıldı' : 'kapatıldı'}`, 'success');
    } catch {
      showToast(`${led.name} — Bağlantı hatası`, 'error');
      networkStatus[led.id] = false;
      renderCards();
    }
  }

  async function allLeds(action) {
    await Promise.all(LEDS.map(led =>
      fetchWithTimeout(`http://${led.host}/led1/${action}`, FETCH_TIMEOUT_MS)
        .then(() => {
          state[led.id] = action === 'on';
          networkStatus[led.id] = true;
        })
        .catch(() => {
          networkStatus[led.id] = false;
        })
    ));
    saveToStorage();
    renderCards();
    showToast(action === 'on' ? 'Tüm odalar açıldı' : 'Tüm odalar kapatıldı', 'success');
  }

  function endHold() {
    clearTimeout(holdTimer);
    holdTimer = null;
    if (holdCard) holdCard.classList.remove('pressing');
    holdCard = null;
    isHolding = false;
    if (pendingRender) renderCards();
  }

  function openForceMenu(led) {
    forceTarget = led;
    document.getElementById('forceTitle').textContent = `${led.icon} ${led.name}`;
    document.getElementById('forceOverlay').classList.add('show');
  }

  function closeForceMenu() {
    document.getElementById('forceOverlay').classList.remove('show');
    forceTarget = null;
  }

  async function forceSet(action) {
    const led = forceTarget;
    if (!led) return;
    closeForceMenu();

    const url = `http://${led.host}/led1/${action}`;
    const deadline = Date.now() + 5000;

    while (Date.now() < deadline) {
      const remaining = deadline - Date.now();
      try {
        await fetchWithTimeout(url, Math.min(1200, remaining));
        state[led.id] = (action === 'on');
        networkStatus[led.id] = true;
        saveToStorage();
        renderCards();
        showToast(`${led.name} zorla ${action === 'on' ? 'açıldı' : 'kapatıldı'}`, 'success');
        return;
      } catch {
        const waitMs = Math.min(250, deadline - Date.now());
        if (waitMs > 0) await new Promise(resolve => setTimeout(resolve, waitMs));
      }
    }

    networkStatus[led.id] = false;
    renderCards();
    showToast(`${led.name} — 5 saniye denendi, bağlantı kurulamadı`, 'error');
  }

  document.getElementById('forceOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'forceOverlay') closeForceMenu();
  });

  // Mobil uyumlu dokunma & uzun basma yönetimi
  const gridEl = document.getElementById('ledGrid');

  function handleStart(x, y, target) {
    const card = target.closest('.led-card');
    if (!card) return;
    const led = LEDS.find(l => 'card-' + l.id === card.id);
    if (!led) return;

    isHolding = true;
    holdFired = false;
    holdCard = card;
    holdLed = led;
    startX = x;
    startY = y;

    card.classList.add('pressing');

    holdTimer = setTimeout(() => {
      holdFired = true;
      if (navigator.vibrate) navigator.vibrate(40);
      endHold();
      openForceMenu(led);
    }, HOLD_MS);
  }

  function handleMove(x, y) {
    if (!isHolding) return;
    if (Math.abs(x - startX) > MOVE_TOLERANCE || Math.abs(y - startY) > MOVE_TOLERANCE) {
      holdLed = null;
      endHold();
    }
  }

  function handleEnd() {
    if (!isHolding) return;
    const led = holdLed;
    const fired = holdFired;
    endHold();
    if (!fired && led) toggle(led);
  }

  // Dokunmatik ekranlar (iOS / Android)
  gridEl.addEventListener('touchstart', (e) => {
    if (e.touches.length > 1) return;
    const t = e.touches[0];
    handleStart(t.clientX, t.clientY, e.target);
  }, { passive: true });

  gridEl.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    handleMove(t.clientX, t.clientY);
  }, { passive: true });

  gridEl.addEventListener('touchend', (e) => {
    if (isHolding) {
      e.preventDefault();
      handleEnd();
    }
  });

  gridEl.addEventListener('touchcancel', () => {
    holdLed = null;
    endHold();
  });

  // Masaüstü / Fare desteği
  gridEl.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    handleStart(e.clientX, e.clientY, e.target);
  });

  window.addEventListener('mousemove', (e) => {
    if (isHolding) handleMove(e.clientX, e.clientY);
  });

  window.addEventListener('mouseup', () => {
    if (isHolding) handleEnd();
  });

  gridEl.addEventListener('contextmenu', (e) => e.preventDefault());

  let toastTimer;
  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = 'toast'; }, 2400);
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js?v=3');
  }

  updateClockAndUI();
  setInterval(updateClockAndUI, 1000);

  renderCards();
  checkAllStatuses();
  setInterval(checkAllStatuses, 5000);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      updateClockAndUI();
      checkAllStatuses();
    }
  });

  window.addEventListener('focus', () => checkAllStatuses());
  window.addEventListener('pageshow', (e) => {
    if (e.persisted) {
      updateClockAndUI();
      checkAllStatuses();
    }
  });
</script>
</body>
</html>
