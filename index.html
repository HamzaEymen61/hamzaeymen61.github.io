<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070709">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Akıllı Ev">
  <title>Akıllı Ev</title>
  <link rel="apple-touch-icon" href="https://github.com/HamzaEymen61/foto/raw/main/icon-192.png">


<style>
/* =========================================
   FUTURE CONTROL — BLACK EDITION
   Akıllı Ev Arayüzü
   ========================================= */

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}

:root {
  --background: #050506;
  --background-soft: #0b0c0e;

  --surface: #111214;
  --surface-light: #181a1d;
  --surface-active: #202226;

  --border: rgba(255,255,255,.075);
  --border-light: rgba(255,255,255,.13);

  --white: #f4f5f6;
  --secondary: #a2a5aa;
  --muted: #656970;

  --glow: rgba(255,255,255,.10);
  --radius: 23px;
}

html, body {
  width: 100%;
  height: 100%;
  background: var(--background);
  color: var(--white);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    system-ui,
    sans-serif;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

body {
  display: flex;
  justify-content: center;
  position: relative;

  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
}

/* =========================================
   BACKGROUND — DEEP BLACK
   ========================================= */

.ambient-bg {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: 0;
  pointer-events: none;

  background:
    radial-gradient(
      ellipse at 50% 0%,
      rgba(255,255,255,.055),
      transparent 48%
    ),
    linear-gradient(
      180deg,
      #111214 0%,
      #080809 45%,
      #030304 100%
    );
}

/* Çok hafif arka plan ışıkları */

.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(100px);
  opacity: .25;
  animation: floatOrb 24s ease-in-out infinite alternate;
}

.orb-1 {
  width: 300px;
  height: 300px;
  top: -150px;
  left: -120px;
  background: rgba(190,195,205,.16);
}

.orb-2 {
  width: 300px;
  height: 300px;
  right: -150px;
  bottom: 5%;
  background: rgba(150,155,165,.10);
  animation-delay: -8s;
}

.orb-3 {
  width: 220px;
  height: 220px;
  top: 45%;
  left: 20%;
  background: rgba(255,255,255,.045);
  animation-delay: -13s;
}

@keyframes floatOrb {
  from {
    transform: translate(0,0) scale(1);
  }
  to {
    transform: translate(18px,-20px) scale(1.08);
  }
}

/* =========================================
   MAIN APP
   ========================================= */

.app {
  position: relative;
  z-index: 1;

  width: 100%;
  max-width: 430px;
  height: 100dvh;

  padding: 23px 22px 26px;

  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* =========================================
   HEADER — DIGITAL CLOCK
   ========================================= */

header {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;

  padding-top: 12px;
  flex-shrink: 0;
}

.live-time {
  font-size: 65px;
  font-weight: 250;
  letter-spacing: -4px;
  line-height: 1;

  color: #f5f5f5;

  font-variant-numeric: tabular-nums;

  text-shadow:
    0 0 28px rgba(255,255,255,.055);
}

.greeting-pill {
  margin-top: 13px;

  padding: 7px 16px;

  border-radius: 999px;

  background: rgba(255,255,255,.045);

  border: 1px solid rgba(255,255,255,.105);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.075);

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  display: inline-flex;
  align-items: center;
  gap: 7px;
}

.greeting-text {
  font-size: 12px;
  font-weight: 500;
  color: #dedfe1;
  letter-spacing: .1px;
}

.live-date {
  font-size: 12px;
  font-weight: 400;
  color: var(--muted);

  margin-top: 9px;

  text-transform: capitalize;
  letter-spacing: .2px;
}

/* =========================================
   MAIN CONTENT
   ========================================= */

.main-content {
  flex: 1;

  display: flex;
  flex-direction: column;
  justify-content: center;

  min-height: 0;
  margin: 12px 0;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-bottom: 15px;
  padding: 0 4px;
}

.section-label {
  font-size: 10px;
  font-weight: 650;

  letter-spacing: .19em;
  text-transform: uppercase;

  color: #777b81;
}

.active-count {
  font-size: 11px;
  font-weight: 500;
  color: #bfc1c5;

  font-variant-numeric: tabular-nums;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

/* =========================================
   ROOM CARDS — FUTURE CONTROL
   ========================================= */

.led-card {
  position: relative;

  height: 124px;
  padding: 16px;

  border-radius: var(--radius);

  cursor: pointer;
  overflow: hidden;
  isolation: isolate;

  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: flex-start;

  touch-action: manipulation;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.065),
      rgba(255,255,255,.018)
    );

  border: 1px solid var(--border);

  border-top-color: rgba(255,255,255,.15);

  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);

  box-shadow:
    0 9px 25px rgba(0,0,0,.30),
    inset 0 1px 0 rgba(255,255,255,.075);

  transition:
    transform .23s cubic-bezier(.22,1,.36,1),
    background .3s ease,
    border-color .3s ease,
    box-shadow .3s ease,
    opacity .25s ease;
}

/* Cam yüzey yansıması */

.led-card::before {
  content: "";

  position: absolute;
  inset: 0;
  z-index: -1;

  pointer-events: none;

  background:
    radial-gradient(
      ellipse at 15% 0%,
      rgba(255,255,255,.105),
      transparent 57%
    ),
    linear-gradient(
      125deg,
      rgba(255,255,255,.025),
      transparent 60%
    );

  opacity: .75;
  transition: opacity .3s ease;
}

/* Uzun basma göstergesi */

.led-card::after {
  content: "";

  position: absolute;
  bottom: 0;
  left: 0;

  width: 0;
  height: 2px;

  background: linear-gradient(
    90deg,
    rgba(255,255,255,.25),
    #f1f1f1
  );

  box-shadow: 0 0 10px rgba(255,255,255,.45);
  border-radius: 0 5px 5px 0;
}

.led-card.pressing {
  transform: scale(.96);
}

.led-card.pressing::after {
  width: 100%;
  transition: width 1s linear;
}

.led-card * {
  pointer-events: none;
}

/* =========================================
   ACTIVE ROOM
   ========================================= */

.led-card.on {
  background:
    radial-gradient(
      ellipse at 20% 0%,
      rgba(255,255,255,.105),
      transparent 65%
    ),
    linear-gradient(
      145deg,
      #26282b,
      #151618
    );

  border-color: rgba(255,255,255,.20);
  border-top-color: rgba(255,255,255,.34);

  box-shadow:
    0 12px 28px rgba(0,0,0,.38),
    0 0 22px rgba(255,255,255,.035),
    inset 0 1px 0 rgba(255,255,255,.17);
}

.led-card.on::before {
  opacity: 1;

  background:
    radial-gradient(
      circle at 25% 12%,
      rgba(255,255,255,.14),
      transparent 65%
    );
}

/* =========================================
   OFFLINE / LOADING
   ========================================= */

.led-card.offline {
  opacity: .38;
}

.led-card.on.offline {
  opacity: .55;
  box-shadow: none;
}

.led-card.loading {
  opacity: .5;
  pointer-events: none;
}

/* =========================================
   ROOM ICONS
   ========================================= */

.led-card-top {
  width: 100%;

  display: flex;
  justify-content: space-between;
  align-items: center;

  z-index: 1;
}

.icon-bubble {
  width: 40px;
  height: 40px;

  border-radius: 14px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(255,255,255,.055);

  border: 1px solid rgba(255,255,255,.095);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.09);

  transition:
    background .3s ease,
    border-color .3s ease,
    box-shadow .3s ease;
}

.led-card.on .icon-bubble {
  background: rgba(255,255,255,.13);

  border-color: rgba(255,255,255,.20);

  box-shadow:
    0 0 14px rgba(255,255,255,.055),
    inset 0 1px 0 rgba(255,255,255,.17);
}

.led-icon {
  font-size: 21px;
  line-height: 1;

  transition: transform .3s ease;
}

.led-card.on .led-icon {
  transform: scale(1.07);
}

.top-right-indicators {
  display: flex;
  align-items: center;
  gap: 7px;
}

.offline-badge {
  font-size: 11px;
  opacity: .8;
  display: none;
}

.led-card.offline .offline-badge {
  display: inline-block;
}

.led-status-dot {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: rgba(255,255,255,.19);

  transition: all .3s ease;
}

.led-card.on:not(.offline) .led-status-dot {
  background: #eeeeee;

  box-shadow:
    0 0 7px rgba(255,255,255,.85),
    0 0 14px rgba(255,255,255,.18);
}

/* =========================================
   ROOM TEXT
   ========================================= */

.led-card-bottom {
  display: flex;
  flex-direction: column;
  align-items: flex-start;

  z-index: 1;
}

.led-name {
  font-size: 14px;
  font-weight: 600;

  color: #b9bbc0;
  letter-spacing: -.2px;

  transition: color .3s ease;
}

.led-card.on .led-name {
  color: #ffffff;
}

.led-status-text {
  font-size: 11px;
  font-weight: 400;

  color: #696d73;

  margin-top: 4px;

  transition: color .3s ease;
}

.led-card.on .led-status-text {
  color: #c9cbd0;
  font-weight: 500;
}

/* =========================================
   CENTRAL CONTROLS
   ========================================= */

.footer-controls {
  flex-shrink: 0;
}

.all-controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.all-btn {
  position: relative;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.075),
      rgba(255,255,255,.025)
    );

  border: 1px solid rgba(255,255,255,.105);
  border-top-color: rgba(255,255,255,.19);

  border-radius: 19px;

  color: #e9e9ea;

  font-size: 12px;
  font-weight: 550;

  padding: 17px 10px;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;

  box-shadow:
    0 8px 20px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.065);

  transition:
    transform .2s ease,
    background .2s ease,
    border-color .2s ease;

  touch-action: manipulation;
}

.all-btn:active {
  transform: scale(.96);
  background: rgba(255,255,255,.13);
}

/* =========================================
   TOAST NOTIFICATIONS
   ========================================= */

.toast {
  position: fixed;

  top: calc(14px + env(safe-area-inset-top));
  left: 50%;

  transform: translateX(-50%) translateY(-90px) scale(.94);

  background: rgba(24,25,28,.94);

  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);

  border: 1px solid rgba(255,255,255,.14);
  border-top-color: rgba(255,255,255,.24);

  border-radius: 999px;

  color: #f3f3f3;

  font-size: 12px;
  font-weight: 500;

  padding: 11px 20px;

  transition:
    transform .35s cubic-bezier(.22,1,.36,1),
    opacity .28s;

  opacity: 0;
  z-index: 120;

  box-shadow: 0 12px 32px rgba(0,0,0,.5);

  white-space: nowrap;
  pointer-events: none;
}

.toast.show {
  transform: translateX(-50%) translateY(0) scale(1);
  opacity: 1;
}

.toast.error {
  border-color: rgba(255,110,110,.35);
  color: #ff9696;
}

/* =========================================
   FORCE CONTROL OVERLAY
   ========================================= */

.force-overlay {
  position: fixed;
  inset: 0;

  background: rgba(0,0,0,.72);

  backdrop-filter: blur(11px);
  -webkit-backdrop-filter: blur(11px);

  opacity: 0;
  pointer-events: none;

  transition: opacity .28s ease;

  z-index: 100;
}

.force-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

/* Alt kontrol paneli */

.force-sheet {
  position: fixed;

  left: 50%;

  bottom: calc(12px + env(safe-area-inset-bottom));

  width: calc(100% - 24px);
  max-width: 406px;

  transform: translate(-50%,115%);

  background:
    radial-gradient(
      ellipse at 50% 0%,
      rgba(255,255,255,.075),
      transparent 65%
    ),
    linear-gradient(
      160deg,
      rgba(35,36,40,.97),
      rgba(13,14,16,.98)
    );

  backdrop-filter: blur(35px);
  -webkit-backdrop-filter: blur(35px);

  border: 1px solid rgba(255,255,255,.15);
  border-top-color: rgba(255,255,255,.29);

  border-radius: 29px;

  padding: 14px 18px 18px;

  box-shadow:
    0 24px 60px rgba(0,0,0,.65),
    inset 0 1px 0 rgba(255,255,255,.08);

  transition: transform .38s cubic-bezier(.22,1,.36,1);

  z-index: 101;
}

.force-overlay.show .force-sheet {
  transform: translate(-50%,0);
}

/* Panel tutamacı */

.sheet-grabber {
  width: 36px;
  height: 4px;

  border-radius: 99px;

  background: rgba(255,255,255,.25);

  margin: 0 auto 15px;
}

.force-title {
  font-size: 17px;
  font-weight: 600;

  text-align: center;
  letter-spacing: -.2px;

  color: #f5f5f5;
}

.force-sub {
  font-size: 11px;
  line-height: 1.5;

  color: #96999e;

  text-align: center;

  margin: 5px 0 18px;
}

/* Zorla kontrol butonları */

.force-btn {
  width: 100%;

  border: 1px solid rgba(255,255,255,.10);
  border-top-color: rgba(255,255,255,.19);

  background: rgba(255,255,255,.065);

  color: #eeeeef;

  font-size: 14px;
  font-weight: 550;

  padding: 15px;

  border-radius: 16px;

  margin-bottom: 10px;

  cursor: pointer;

  transition:
    transform .18s ease,
    background .18s ease;
}

.force-btn:active {
  transform: scale(.97);
}

.force-btn.on {
  background: rgba(255,255,255,.13);
  border-color: rgba(255,255,255,.20);
}

.force-btn.off {
  background: rgba(180,70,70,.12);
  border-color: rgba(220,100,100,.22);
  color: #ffaaaa;
}

.force-btn.cancel {
  background: rgba(255,255,255,.025);
  border-color: transparent;
  color: #a1a3a7;

  margin-bottom: 0;
}

/* =========================================
   RESPONSIVE — SMALL SCREENS
   ========================================= */

@media (max-height: 700px) {
  .app {
    padding-top: 14px;
    padding-bottom: 18px;
  }

  header {
    padding-top: 5px;
  }

  .live-time {
    font-size: 47px;
  }

  .led-card {
    height: 104px;
    padding: 13px;
    border-radius: 19px;
  }

  .icon-bubble {
    width: 34px;
    height: 34px;
    border-radius: 11px;
  }

  .led-icon {
    font-size: 18px;
  }

  .grid {
    gap: 9px;
  }

  .all-btn {
    padding: 13px 9px;
  }
}

/* Hareket azaltma tercihi */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}


/* =========================================
   STEALTH CONTROL — SOFT BLACK

   ========================================= */

/* =========================================
   CINEMATIC POWER TRANSITIONS
   Premium Black Edition
   ========================================= */

/* Kartın açılması */
.led-card.just-turned-on {
  animation: cinematicPowerOn .78s cubic-bezier(.2,.8,.2,1);
}

/* Kartın kapanması */
.led-card.just-turned-off {
  animation: cinematicPowerOff .65s cubic-bezier(.4,0,.2,1);
}

/* Açılma: hafif yükselme ve oturma */
@keyframes cinematicPowerOn {
  0% {
    transform: translateY(3px) scale(.975);
    filter: brightness(.85);
    box-shadow: 0 5px 15px rgba(0,0,0,.25);
  }

  40% {
    transform: translateY(-2px) scale(1.012);
    filter: brightness(1.07);
    box-shadow:
      0 12px 28px rgba(0,0,0,.35),
      0 0 17px rgba(255,255,255,.075);
  }

  75% {
    transform: translateY(0) scale(.998);
    filter: brightness(1.02);
  }

  100% {
    transform: translateY(0) scale(1);
    filter: brightness(1);
    box-shadow:
      0 9px 22px rgba(0,0,0,.34),
      inset 0 1px 0 rgba(255,255,255,.09);
  }
}

/* Kapanma: kontrollü biçimde sönme */
@keyframes cinematicPowerOff {
  0% {
    transform: translateY(-1px) scale(1.008);
    filter: brightness(1.08);
    box-shadow: 0 0 17px rgba(255,255,255,.07);
  }

  55% {
    transform: translateY(1px) scale(.992);
    filter: brightness(.92);
  }

  100% {
    transform: translateY(0) scale(1);
    filter: brightness(1);
    box-shadow:
      0 8px 20px rgba(0,0,0,.32),
      inset 0 1px 0 rgba(255,255,255,.045);
  }
}

/* =========================================
   GLASS LIGHT SWEEP
   Kartın içinden geçen ince ışık
   ========================================= */

.led-card.just-turned-on::before {
  background: linear-gradient(
    112deg,
    transparent 15%,
    rgba(255,255,255,.025) 35%,
    rgba(255,255,255,.15) 50%,
    rgba(255,255,255,.025) 65%,
    transparent 85%
  );

  background-size: 240% 100%;
  background-position: 120% 0;
  opacity: 0;

  animation: glassLightSweep .85s ease-out forwards;
}

@keyframes glassLightSweep {
  0% {
    background-position: 120% 0;
    opacity: 0;
  }

  35% {
    opacity: .8;
  }

  100% {
    background-position: -120% 0;
    opacity: 0;
  }
}

/* =========================================
   ICON SPRING
   İkonun hafifçe canlanması
   ========================================= */

.led-card.just-turned-on .icon-bubble {
  animation: iconSpring .62s cubic-bezier(.2,.8,.2,1);
}

@keyframes iconSpring {
  0% {
    transform: scale(.91);
  }

  45% {
    transform: scale(1.09);
  }

  72% {
    transform: scale(.975);
  }

  100% {
    transform: scale(1);
  }
}

/* İkonun çevresinde kısa halka efekti */

.led-card.just-turned-on .icon-bubble {
  position: relative;
}

.led-card.just-turned-on .icon-bubble::after {
  content: "";
  position: absolute;
  inset: -4px;

  border-radius: 17px;
  border: 1px solid rgba(255,255,255,.22);

  animation: iconRing .7s ease-out forwards;
  pointer-events: none;
}

@keyframes iconRing {
  0% {
    transform: scale(.85);
    opacity: 0;
  }

  35% {
    opacity: .65;
  }

  100% {
    transform: scale(1.16);
    opacity: 0;
  }
}

/* =========================================
   STATUS LIGHT
   Sağ üstteki gösterge
   ========================================= */

.led-card.just-turned-on .led-status-dot {
  animation: statusWake .7s ease-out;
}

@keyframes statusWake {
  0% {
    transform: scale(.7);
    box-shadow: 0 0 0 rgba(255,255,255,0);
  }

  45% {
    transform: scale(1.35);
    box-shadow: 0 0 7px rgba(255,255,255,.25);
  }

  100% {
    transform: scale(1);
    box-shadow: 0 0 4px rgba(255,255,255,.28);
  }
}

/* Kapanırken kapsül yumuşakça küçülsün */
.led-card.just-turned-off .icon-bubble {
  animation: iconSleep .48s ease-out;
}

@keyframes iconSleep {
  0% {
    transform: scale(1);
  }

  55% {
    transform: scale(.94);
  }

  100% {
    transform: scale(1);
  }
}

/* Kapanırken ışık geri çekilsin */
.led-card.just-turned-off::before {
  animation: glassFadeOut .55s ease-out forwards;
}

@keyframes glassFadeOut {
  0% {
    opacity: .9;
  }

  100% {
    opacity: 0;
  }
}

/* Hareket azaltma tercihi */
@media (prefers-reduced-motion: reduce) {
  .led-card.just-turned-on,
  .led-card.just-turned-off,
  .led-card.just-turned-on::before,
  .led-card.just-turned-off::before,
  .led-card.just-turned-on .icon-bubble,
  .led-card.just-turned-off .icon-bubble,
  .led-card.just-turned-on .icon-bubble::after,
  .led-card.just-turned-on .led-status-dot {
    animation: none !important;
  }
}


/* TAM KART DOLUM ANİMASYONU */

.led-card {
  position: relative;
  isolation: isolate;
  overflow: hidden;
}

/* Tüm kartı kaplayan dolum */
.led-card::after {
  content: "";
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  border-radius: inherit;

  transform: scaleX(0);
  transform-origin: left center;

  z-index: 0;
  pointer-events: none;

  transition: none;
  box-shadow: none;
}

/* Kapalı oda: açık renk dolum */
.led-card:not(.on)::after {
  background: rgba(235,235,235,.22);
}

/* Açık oda: koyu renk dolum */
.led-card.on::after {
  background: rgba(0,0,0,.48);
}

/* Basılı tutulduğunda kartın tamamı dolar */
.led-card.pressing::after {
  transform: scaleX(1);
  transition: transform .95s linear;
}

/* Kart yazıları ve ikonları dolumun üzerinde kalır */
.led-card-top,
.led-card-bottom {
  position: relative;
  z-index: 2;
}

/* İçerik görünürlüğü */
.led-card .icon-bubble,
.led-card .top-right-indicators {
  position: relative;
  z-index: 2;
}
/* GECİKMELİ TAM KART DOLUMU */

.led-card::after {
  transform: scaleX(0);
  transform-origin: left center;
  transition: none !important;
}

.led-card.pressing::after {
  transform: scaleX(1);
  transition: transform .76s linear !important;
}

/* Parmağı erken çekince dolum anında sıfırlansın */
.led-card:not(.pressing)::after {
  transform: scaleX(0);
  transition: none !important;
}
</style>


</head>
<body>

<div class="ambient-bg">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="app">
  <header>
    <div class="live-time" id="liveTime">22:36</div>
    <div class="greeting-pill">
      <span class="greeting-text" id="greetingText">İyi Geceler</span>
    </div>
    <div class="live-date" id="liveDate">18 Kasım Çarşamba</div>
  </header>

  <div class="main-content">
    <div class="section-header">
      <span class="section-label">Odalar</span>
      <span class="active-count" id="activeCount">0 açık</span>
    </div>
    <div class="grid" id="ledGrid"></div>
  </div>

  <div class="footer-controls">
    <div class="section-header">
      <span class="section-label">Merkezi Senaryolar</span>
    </div>
    <div class="all-controls">
      <button class="all-btn" onclick="allLeds('on')">✦ Tümünü Aç</button>
      <button class="all-btn" onclick="allLeds('off')">✕ Tümünü Kapat</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="force-overlay" id="forceOverlay">
  <div class="force-sheet">
    <div class="sheet-grabber"></div>
    <div class="force-title" id="forceTitle">Oda</div>
    <div class="force-sub">Mevcut durum yok sayılarak doğrudan komut gönderilir</div>
    <button class="force-btn on" onclick="forceSet('on')">⚡ Zorla Aç</button>
    <button class="force-btn off" onclick="forceSet('off')">⛔ Zorla Kapat</button>
    <button class="force-btn cancel" onclick="closeForceMenu()">Vazgeç</button>
  </div>
</div>

<script>
  const LEDS = [
    { id: 'led1', name: 'Hamza Oda',   host: 'hamza-oda.local',   icon: '🛏️' },
    { id: 'led2', name: 'Salon',       host: 'salon.local',       icon: '🛋️' },
    { id: 'led3', name: 'Mutfak',      host: 'mutfak.local',      icon: '🍽️' },
    { id: 'led4', name: 'Ravza Oda',   host: 'ravza-oda.local',   icon: '🌸' },
    { id: 'led5', name: 'Yatak Odası', host: 'yatak-odasi.local', icon: '🌙' },
  ];

  const FETCH_TIMEOUT_MS = 5000;
  const state = {};
  const networkStatus = {};
  const lastRenderedState = {};

  function loadStoredState() {
    try {
      return JSON.parse(localStorage.getItem('smarthome_state')) || {};
    } catch (e) {
      return {};
    }
  }

  const savedState = loadStoredState();
  LEDS.forEach(l => {
    state[l.id] = savedState[l.id] !== undefined ? savedState[l.id] : false;
    networkStatus[l.id] = null;
  });

  function saveToStorage() {
    try {
      localStorage.setItem('smarthome_state', JSON.stringify(state));
    } catch (e) {}
  }

  function fetchWithTimeout(url, timeoutMs) {
    return new Promise((resolve, reject) => {
      const controller = new AbortController();
      const timer = setTimeout(() => {
        controller.abort();
        reject(new Error('timeout'));
      }, timeoutMs);

      fetch(url, { signal: controller.signal })
        .then(res => { clearTimeout(timer); resolve(res); })
        .catch(err => { clearTimeout(timer); reject(err); });
    });
  }

  function updateClockAndUI() {
    const now = new Date();
    const hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('liveTime').textContent = `${String(hours).padStart(2, '0')}:${minutes}`;

    const options = { day: 'numeric', month: 'long', weekday: 'long' };
    document.getElementById('liveDate').textContent = now.toLocaleDateString('tr-TR', options);

    let greeting = 'İyi Geceler';
    if (hours >= 5 && hours < 12) greeting = 'Günaydın';
    else if (hours >= 12 && hours < 17) greeting = 'Tünaydın';
    else if (hours >= 17 && hours < 22) greeting = 'İyi Akşamlar';
    document.getElementById('greetingText').textContent = greeting;
  }

  const HOLD_MS = 1000;
  const HOLD_FEEDBACK_DELAY_MS = 220;
  const MOVE_TOLERANCE = 14;

  let isHolding = false;
  let pendingRender = false;
  let holdTimer = null;
  let holdFired = false;
  let holdCard = null;
  let holdLed = null;
  let startX = 0, startY = 0;
  let forceTarget = null;
  let holdProgressTimer = null;

  function renderCards() {
    if (isHolding) { pendingRender = true; return; }
    pendingRender = false;

    const activeTotal = LEDS.filter(l => state[l.id]).length;
    document.getElementById('activeCount').textContent =
      activeTotal > 0 ? `${activeTotal} oda açık` : 'Tümü kapalı';

    const grid = document.getElementById('ledGrid');
    grid.innerHTML = '';
    LEDS.forEach(led => {
const isOn = state[led.id];
const isOnline = networkStatus[led.id];
const isOffline = isOnline === false;

const previousState = lastRenderedState[led.id];

const card = document.createElement('div');

let cls = 'led-card';

if (isOn) cls += ' on';
if (isOffline) cls += ' offline';

if (previousState !== undefined && previousState !== isOn) {
  cls += isOn ? ' just-turned-on' : ' just-turned-off';
}

card.className = cls;
card.id = 'card-' + led.id;

lastRenderedState[led.id] = isOn;
      let statusText;
      if (isOffline) {
        statusText = isOn ? 'Açık · Çevrimdışı' : 'Ulaşılamıyor';
      } else {
        statusText = isOn ? 'Açık' : 'Kapalı';
      }

      card.innerHTML = `
        <div class="led-card-top">
          <div class="icon-bubble">
            <span class="led-icon">${led.icon}</span>
          </div>
          <div class="top-right-indicators">
            <span class="offline-badge">⚠️</span>
            <div class="led-status-dot"></div>
          </div>
        </div>
        <div class="led-card-bottom">
          <div class="led-name">${led.name}</div>
          <div class="led-status-text">${statusText}</div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  async function checkAllStatuses() {
    await Promise.all(LEDS.map(async (led) => {
      try {
        const res = await fetchWithTimeout(`http://${led.host}/status`, FETCH_TIMEOUT_MS);
        const data = await res.json();
        state[led.id] = data.status === 'on';
        networkStatus[led.id] = true;
      } catch {
        networkStatus[led.id] = false;
      }
    }));
    saveToStorage();

if (!isHolding) {
  renderCards();
} else {
  pendingRender = true;
}
  }

  async function toggle(led) {
    const action = state[led.id] ? 'off' : 'on';
    const card = document.getElementById('card-' + led.id);
    if (card) card.classList.add('loading');

    try {
      await fetchWithTimeout(`http://${led.host}/led1/${action}`, FETCH_TIMEOUT_MS);
      state[led.id] = !state[led.id];
      networkStatus[led.id] = true;
      saveToStorage();
      renderCards();
      showToast(`${led.name} ${state[led.id] ? 'açıldı' : 'kapatıldı'}`, 'success');
    } catch {
      showToast(`${led.name} — Bağlantı hatası`, 'error');
      networkStatus[led.id] = false;
      renderCards();
    }
  }

  async function allLeds(action) {
    await Promise.all(LEDS.map(led =>
      fetchWithTimeout(`http://${led.host}/led1/${action}`, FETCH_TIMEOUT_MS)
        .then(() => {
          state[led.id] = action === 'on';
          networkStatus[led.id] = true;
        })
        .catch(() => {
          networkStatus[led.id] = false;
        })
    ));
    saveToStorage();
    renderCards();
    showToast(action === 'on' ? 'Tüm odalar açıldı' : 'Tüm odalar kapatıldı', 'success');
  }

  function endHold() {
  clearTimeout(holdTimer);
  clearTimeout(holdProgressTimer);

  holdTimer = null;
  holdProgressTimer = null;

  if (holdCard) {
    holdCard.classList.remove('pressing');
  }

  holdCard = null;
  isHolding = false;

  if (pendingRender) renderCards();
}

  function openForceMenu(led) {
    forceTarget = led;
    document.getElementById('forceTitle').textContent = `${led.icon} ${led.name}`;
    document.getElementById('forceOverlay').classList.add('show');
  }

  function closeForceMenu() {
    document.getElementById('forceOverlay').classList.remove('show');
    forceTarget = null;
  }

  async function forceSet(action) {
    const led = forceTarget;
    if (!led) return;
    closeForceMenu();

    const url = `http://${led.host}/led1/${action}`;
    const deadline = Date.now() + 10000;

    while (Date.now() < deadline) {
      const remaining = deadline - Date.now();
      try {
        await fetchWithTimeout(url, Math.min(1200, remaining));
        state[led.id] = (action === 'on');
        networkStatus[led.id] = true;
        saveToStorage();
        renderCards();
        showToast(`${led.name} zorla ${action === 'on' ? 'açıldı' : 'kapatıldı'}`, 'success');
        return;
      } catch {
        const waitMs = Math.min(250, deadline - Date.now());
        if (waitMs > 0) await new Promise(resolve => setTimeout(resolve, waitMs));
      }
    }

    networkStatus[led.id] = false;
    renderCards();
    showToast(`${led.name} — 10 sn denendi, ulaşılamadı`, 'error');
  }

  document.getElementById('forceOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'forceOverlay') closeForceMenu();
  });

  const gridEl = document.getElementById('ledGrid');

  function handleStart(x, y, target) {
    const card = target.closest('.led-card');
    if (!card) return;
    const led = LEDS.find(l => 'card-' + l.id === card.id);
    if (!led) return;

    isHolding = true;
    holdFired = false;
    holdCard = card;
    holdLed = led;
    startX = x;
    startY = y;

    holdProgressTimer = setTimeout(() => {
  if (isHolding && holdCard === card) {
    card.classList.add('pressing');
    holdProgressTimer = null;
  }
}, HOLD_FEEDBACK_DELAY_MS);

    holdTimer = setTimeout(() => {
      holdFired = true;
      if (navigator.vibrate) navigator.vibrate(40);
      endHold();
      openForceMenu(led);
    }, HOLD_MS);
  }

  function handleMove(x, y) {
    if (!isHolding) return;
    if (Math.abs(x - startX) > MOVE_TOLERANCE || Math.abs(y - startY) > MOVE_TOLERANCE) {
      holdLed = null;
      endHold();
    }
  }

  function handleEnd() {
    if (!isHolding) return;
    const led = holdLed;
    const fired = holdFired;
    endHold();
    if (!fired && led) toggle(led);
  }

  gridEl.addEventListener('touchstart', (e) => {
    if (e.touches.length > 1) return;
    const t = e.touches[0];
    handleStart(t.clientX, t.clientY, e.target);
  }, { passive: true });

  gridEl.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    handleMove(t.clientX, t.clientY);
  }, { passive: true });

  gridEl.addEventListener('touchend', (e) => {
    if (isHolding) {
      e.preventDefault();
      handleEnd();
    }
  });

  gridEl.addEventListener('touchcancel', () => {
    holdLed = null;
    endHold();
  });

  gridEl.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    handleStart(e.clientX, e.clientY, e.target);
  });

  window.addEventListener('mousemove', (e) => {
    if (isHolding) handleMove(e.clientX, e.clientY);
  });

  window.addEventListener('mouseup', () => {
    if (isHolding) handleEnd();
  });

  gridEl.addEventListener('contextmenu', (e) => e.preventDefault());

  let toastTimer;
  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = 'toast'; }, 2400);
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js?v=3');
  }

  updateClockAndUI();
  setInterval(updateClockAndUI, 1000);

  renderCards();
  checkAllStatuses();
  setInterval(checkAllStatuses, 15000);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      updateClockAndUI();
      checkAllStatuses();
    }
  });

  window.addEventListener('focus', () => checkAllStatuses());
  window.addEventListener('pageshow', (e) => {
    if (e.persisted) {
      updateClockAndUI();
      checkAllStatuses();
    }
  });
</script>
</body>
</html>
