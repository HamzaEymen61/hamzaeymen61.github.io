<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050507" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Akıllı Ev" />
  <title>Akıllı Ev</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-base: #050507;
      --glass-surface: rgba(255, 255, 255, 0.045);
      --glass-surface-hover: rgba(255, 255, 255, 0.075);
      --glass-active: rgba(255, 255, 255, 0.14);
      --glass-border-top: rgba(255, 255, 255, 0.24);
      --glass-border-side: rgba(255, 255, 255, 0.09);
      --glass-border-bottom: rgba(255, 255, 255, 0.04);
      --text-primary: rgba(255, 255, 255, 0.96);
      --text-secondary: rgba(255, 255, 255, 0.56);
      --text-tertiary: rgba(255, 255, 255, 0.36);
      --amber-glow: rgba(255, 214, 102, 0.28);
      --amber-accent: #ffd60a;
      --danger: #ff453a;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* Apple Liquid Glass arka plan ışık küreleri (derinlik ve kırılma hissi için) */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(85px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.55;
      animation: floatOrb 18s ease-in-out infinite alternate;
    }

    body::before {
      width: 340px;
      height: 340px;
      top: -80px;
      left: -60px;
      background: radial-gradient(circle, rgba(56, 112, 255, 0.28) 0%, rgba(120, 80, 255, 0.08) 60%, transparent 100%);
    }

    body::after {
      width: 320px;
      height: 320px;
      bottom: -90px;
      right: -70px;
      background: radial-gradient(circle, rgba(255, 179, 64, 0.16) 0%, rgba(94, 92, 230, 0.14) 55%, transparent 100%);
      animation-delay: -9s;
    }

    @keyframes floatOrb {
      0%   { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(24px, 32px, 0) scale(1.08); }
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      height: 100%;
      padding: 26px 22px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* ===== ÜST BÖLÜM: SAAT & DURUM ===== */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 10px;
      margin-bottom: 4px;
    }

    .live-time {
      font-size: 56px;
      font-weight: 200;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
      line-height: 0.96;
      background: linear-gradient(180deg, #ffffff 30%, rgba(255, 255, 255, 0.68) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 24px rgba(255, 255, 255, 0.08));
    }

    .greeting-text {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin-top: 8px;
      letter-spacing: -0.2px;
      opacity: 0.92;
      min-height: 18px;
    }

    .live-date {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-secondary);
      margin-top: 3px;
      letter-spacing: 0.01em;
      text-transform: capitalize;
      min-height: 15px;
    }

    .version-pill {
      margin-top: 8px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--text-tertiary);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      padding: 3px 10px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* ===== BÖLÜM BAŞLIKLARI ===== */
    .section-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-secondary);
      margin-bottom: 12px;
      margin-left: 4px;
    }

    .main-content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* ===== APPLE HOME LIQUID GLASS KARTLAR ===== */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
    }

    .led-card {
      position: relative;
      height: 124px;
      border-radius: 26px;
      padding: 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      overflow: hidden;

      /* Liquid Glass çok katmanlı cam yüzeyi */
      background: linear-gradient(
        155deg,
        rgba(255, 255, 255, 0.085) 0%,
        rgba(255, 255, 255, 0.025) 55%,
        rgba(255, 255, 255, 0.045) 100%
      );
      backdrop-filter: blur(36px) saturate(180%);
      -webkit-backdrop-filter: blur(36px) saturate(180%);

      /* Kenar ışık kırılması (specular rim) */
      border-top: 1px solid var(--glass-border-top);
      border-left: 1px solid rgba(255, 255, 255, 0.14);
      border-right: 1px solid var(--glass-border-side);
      border-bottom: 1px solid var(--glass-border-bottom);

      box-shadow:
        0 10px 30px -6px rgba(0, 0, 0, 0.55),
        inset 0 1px 1px rgba(255, 255, 255, 0.18),
        inset 0 -8px 20px rgba(0, 0, 0, 0.25);

      transition:
        transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
        background 0.4s ease,
        box-shadow 0.4s ease,
        border-color 0.4s ease,
        opacity 0.35s ease;

      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    /* Üst cam parlama yansıması */
    .led-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(
        120% 80% at 15% 0%,
        rgba(255, 255, 255, 0.14) 0%,
        rgba(255, 255, 255, 0) 60%
      );
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .led-card * {
      pointer-events: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .led-card:active {
      transform: scale(0.955);
    }

    /* Uzun basma ilerleme çizgisi (Liquid shimmer) */
    .led-card::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      height: 3px;
      width: 0;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.4), #ffffff);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      border-radius: 0 3px 3px 0;
    }

    .led-card.pressing::after {
      width: 100%;
      transition: width 1s linear;
    }

    .led-card.pressing {
      transform: scale(0.95);
    }

    /* ===== AÇIK (ON) DURUMU — APPLE HOME AYDINLATMA CAMI ===== */
    .led-card.on {
      background: linear-gradient(
        155deg,
        rgba(255, 255, 255, 0.22) 0%,
        rgba(255, 244, 214, 0.11) 50%,
        rgba(255, 255, 255, 0.14) 100%
      );
      border-top: 1px solid rgba(255, 255, 255, 0.52);
      border-left: 1px solid rgba(255, 255, 255, 0.30);
      border-right: 1px solid rgba(255, 255, 255, 0.18);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 14px 34px -6px rgba(0, 0, 0, 0.6),
        0 0 28px -4px rgba(255, 224, 140, 0.22),
        inset 0 1px 1.5px rgba(255, 255, 255, 0.45);
    }

    .led-card.on::before {
      background: radial-gradient(
        130% 90% at 15% 0%,
        rgba(255, 245, 210, 0.32) 0%,
        rgba(255, 255, 255, 0) 65%
      );
    }

    /* Offline ama son durum "açık" */
    .led-card.on.offline {
      opacity: 0.52;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    /* Offline ve kapalı */
    .led-card.offline {
      opacity: 0.32;
    }

    .led-card.loading {
      opacity: 0.45;
      pointer-events: none;
    }

    .offline-badge {
      position: absolute;
      top: 13px;
      right: 13px;
      font-size: 11px;
      opacity: 0.75;
      display: none;
      z-index: 2;
    }
    .led-card.offline .offline-badge { display: block; }

    .led-card-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1;
    }

    /* Apple Home tarzı dairesel cam ikon rozeti */
    .led-icon-wrap {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 1px 0.5px rgba(255, 255, 255, 0.15);
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .led-card.on .led-icon-wrap {
      background: rgba(255, 214, 10, 0.22);
      border-color: rgba(255, 224, 102, 0.48);
      box-shadow:
        0 0 16px rgba(255, 214, 10, 0.32),
        inset 0 1px 1px rgba(255, 255, 255, 0.45);
      transform: scale(1.04);
    }

    .led-icon {
      font-size: 20px;
      line-height: 1;
      transition: transform 0.3s ease;
    }

    .led-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      transition: all 0.35s ease;
    }

    .led-card.on:not(.offline) .led-status-dot {
      background: var(--amber-accent);
      box-shadow: 0 0 10px var(--amber-accent), 0 0 4px #ffffff;
    }

    .led-card.offline .led-status-dot {
      display: none;
    }

    .led-card-bottom {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      z-index: 1;
    }

    .led-name {
      font-size: 15px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.72);
      letter-spacing: -0.22px;
      transition: color 0.3s ease;
    }

    .led-card.on .led-name {
      color: #ffffff;
    }

    .led-status-text {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-tertiary);
      margin-top: 2px;
      letter-spacing: -0.08px;
      transition: color 0.3s ease;
    }

    .led-card.on .led-status-text {
      color: rgba(255, 242, 204, 0.88);
    }

    /* ===== ALT SENARYO BUTONLARI (LIQUID GLASS PILL) ===== */
    .all-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 4px;
      margin-bottom: 4px;
    }

    .all-btn {
      position: relative;
      background: linear-gradient(
        160deg,
        rgba(255, 255, 255, 0.085) 0%,
        rgba(255, 255, 255, 0.03) 100%
      );
      border-top: 1px solid rgba(255, 255, 255, 0.22);
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 20px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 15px 14px;
      cursor: pointer;
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.45),
        inset 0 1px 0.5px rgba(255, 255, 255, 0.16);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), background 0.25s ease;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: -0.15px;
    }

    .all-btn:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.12);
    }

    /* ===== DYNAMIC ISLAND TARZI TOAST BİLDİRİM ===== */
    .toast {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%) translateY(-90px) scale(0.92);
      background: rgba(18, 18, 22, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(32px) saturate(190%);
      -webkit-backdrop-filter: blur(32px) saturate(190%);
      border-radius: 999px;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.1px;
      padding: 10px 20px;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
      opacity: 0;
      z-index: 120;
      white-space: nowrap;
      box-shadow:
        0 14px 36px rgba(0, 0, 0, 0.65),
        inset 0 1px 0.5px rgba(255, 255, 255, 0.22);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0) scale(1);
      opacity: 1;
    }
    .toast.success { color: #ffffff; }
    .toast.error {
      border-color: rgba(255, 69, 58, 0.4);
      color: #ff6961;
    }

    /* ===== iOS LIQUID GLASS BOTTOM SHEET (ZORLA MENÜSÜ) ===== */
    .force-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.52);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }
    .force-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .force-sheet {
      position: fixed;
      left: 50%;
      bottom: 12px;
      width: calc(100% - 24px);
      max-width: 396px;
      transform: translate(-50%, 115%);
      background: linear-gradient(
        170deg,
        rgba(38, 38, 44, 0.78) 0%,
        rgba(22, 22, 26, 0.88) 100%
      );
      backdrop-filter: blur(44px) saturate(200%);
      -webkit-backdrop-filter: blur(44px) saturate(200%);
      border-top: 1px solid rgba(255, 255, 255, 0.28);
      border-left: 1px solid rgba(255, 255, 255, 0.14);
      border-right: 1px solid rgba(255, 255, 255, 0.10);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 32px;
      padding: 12px 18px calc(18px + env(safe-area-inset-bottom));
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.75),
        inset 0 1px 1px rgba(255, 255, 255, 0.25);
      transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 101;
    }
    .force-overlay.show .force-sheet {
      transform: translate(-50%, 0);
    }

    /* iOS Sheet Tutamaç Çubuğu */
    .sheet-grabber {
      width: 36px;
      height: 4px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.26);
      margin: 0 auto 14px;
    }

    .force-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.25px;
      text-align: center;
    }

    .force-sub {
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
      margin: 4px 0 18px;
    }

    .force-btn {
      width: 100%;
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      background: rgba(255, 255, 255, 0.07);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
      padding: 15px;
      border-radius: 18px;
      margin-bottom: 10px;
      cursor: pointer;
      box-shadow: inset 0 1px 0.5px rgba(255, 255, 255, 0.12);
      transition: transform 0.2s ease, background 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .force-btn:active { transform: scale(0.97); }
    .force-btn.on {
      background: rgba(255, 214, 10, 0.16);
      border-color: rgba(255, 214, 10, 0.36);
      color: #ffe066;
    }
    .force-btn.off {
      background: rgba(255, 69, 58, 0.14);
      border-color: rgba(255, 69, 58, 0.32);
      color: #ff6961;
    }
    .force-btn.cancel {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.08);
      color: var(--text-secondary);
      font-weight: 500;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="live-time" id="liveTime">--:--</div>
    <div class="greeting-text" id="greetingText"></div>
    <div class="live-date" id="liveDate"></div>
    <div class="version-pill">sürüm: uzun-basma-1sn</div>
  </header>

  <div class="main-content">
    <p class="section-label">Odalar</p>
    <div class="grid" id="ledGrid"></div>
  </div>

  <div>
    <p class="section-label">Merkezi Senaryolar</p>
    <div class="all-controls">
      <button class="all-btn" onclick="allLeds('on')">✦ Tümünü Aç</button>
      <button class="all-btn" onclick="allLeds('off')">✕ Tümünü Kapat</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="force-overlay" id="forceOverlay">
  <div class="force-sheet">
    <div class="sheet-grabber"></div>
    <div class="force-title" id="forceTitle">Oda</div>
    <div class="force-sub">Mevcut durum yok sayılarak komut gönderilir</div>
    <button class="force-btn on"  onclick="forceSet('on')">⚡ Zorla Aç</button>
    <button class="force-btn off" onclick="forceSet('off')">⛔ Zorla Kapat</button>
    <button class="force-btn cancel" onclick="closeForceMenu()">İptal</button>
  </div>
</div>

<script>
const icon = document.createElement('link');
  icon.rel = 'apple-touch-icon';
  icon.href = 'https://github.com/HamzaEymen61/foto/raw/main/icon-192.png'; // Linki kısaltalım
  document.head.appendChild(icon);
  const LEDS = [
    { id: 'led1', name: 'Hamza Oda',    host: 'hamza-oda.local',     icon: '🛏️' },
    { id: 'led2', name: 'Salon',         host: 'salon.local',          icon: '🛋️' },
    { id: 'led3', name: 'Mutfak',        host: 'mutfak.local',         icon: '🍽️' },
    { id: 'led4', name: 'Ravza Oda',    host: 'ravza-oda.local',      icon: '🌸' },
    { id: 'led5', name: 'Yatak Odası',  host: 'yatak-odasi.local',    icon: '🌙' },
  ];

  const FETCH_TIMEOUT_MS = 3000; // iOS için biraz daha uzun timeout

  const state = {};
  const networkStatus = {};

  // localStorage'dan son bilinen durumu yükle
  function loadStoredState() {
    try {
      return JSON.parse(localStorage.getItem('smarthome_state')) || {};
    } catch (e) {
      return {};
    }
  }

  const savedState = loadStoredState();
  LEDS.forEach(l => {
    state[l.id] = savedState[l.id] !== undefined ? savedState[l.id] : false;
    networkStatus[l.id] = null; // null = henüz kontrol edilmedi
  });

  function saveToStorage() {
    try {
      localStorage.setItem('smarthome_state', JSON.stringify(state));
    } catch (e) {}
  }

  // iOS uyumlu fetch wrapper — AbortSignal.timeout() iOS 15 altında yok
  function fetchWithTimeout(url, timeoutMs) {
    return new Promise((resolve, reject) => {
      const controller = new AbortController();
      const timer = setTimeout(() => {
        controller.abort();
        reject(new Error('timeout'));
      }, timeoutMs);

      fetch(url, { signal: controller.signal })
        .then(res => { clearTimeout(timer); resolve(res); })
        .catch(err => { clearTimeout(timer); reject(err); });
    });
  }

  // SAAT VE SELAMLAMA
  function updateClockAndUI() {
    const now = new Date();
    const hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('liveTime').textContent = `${String(hours).padStart(2, '0')}:${minutes}`;

    const options = { day: 'numeric', month: 'long', weekday: 'long' };
    document.getElementById('liveDate').textContent = now.toLocaleDateString('tr-TR', options);

    let greeting = 'İyi Geceler';
    if (hours >= 5 && hours < 12) greeting = 'Günaydın';
    else if (hours >= 12 && hours < 17) greeting = 'Tünaydın';
    else if (hours >= 17 && hours < 22) greeting = 'İyi Akşamlar';
    document.getElementById('greetingText').textContent = greeting;
  }

  // ===== UZUN BASMA / ZORLA AÇ-KAPAT DEĞİŞKENLERİ =====
  const HOLD_MS = 1000;
  const MOVE_TOLERANCE = 10; // px — parmak kayarsa iptal

  let isHolding = false;
  let pendingRender = false;
  let holdTimer = null;
  let holdFired = false;
  let holdCard = null;
  let holdLed = null;
  let startX = 0, startY = 0;
  let forceTarget = null; // menüde seçili oda

  function renderCards() {
    // Basılı tutma sırasında DOM'u silme, bitince çiz
    if (isHolding) { pendingRender = true; return; }
    pendingRender = false;

    const grid = document.getElementById('ledGrid');
    grid.innerHTML = '';
    LEDS.forEach(led => {
      const isOn = state[led.id];
      const isOnline = networkStatus[led.id];   // true | false | null
      const isOffline = isOnline === false;

      const card = document.createElement('div');
      let cls = 'led-card';
      if (isOn)      cls += ' on';
      if (isOffline) cls += ' offline';
      card.className = cls;
      card.id = 'card-' + led.id;

      let statusText;
      if (isOffline) {
        statusText = isOn ? 'Açık (çevrimdışı)' : 'Ulaşılamıyor';
      } else {
        statusText = isOn ? 'Açık' : 'Kapalı';
      }

      card.innerHTML = `
        <span class="offline-badge">⚠️</span>
        <div class="led-card-top">
          <div class="led-icon-wrap">
            <span class="led-icon">${led.icon}</span>
          </div>
          <div class="led-status-dot"></div>
        </div>
        <div class="led-card-bottom">
          <div class="led-name">${led.name}</div>
          <div class="led-status-text">${statusText}</div>
        </div>
      `;
      // Tıklama artık aşağıdaki pointer olaylarıyla yönetiliyor
      grid.appendChild(card);
    });
  }

  async function checkAllStatuses() {
    await Promise.all(LEDS.map(async (led) => {
      try {
        const res = await fetchWithTimeout(`http://${led.host}/status`, FETCH_TIMEOUT_MS);
        const data = await res.json();
        state[led.id] = data.status === 'on';
        networkStatus[led.id] = true;
      } catch {
        networkStatus[led.id] = false;
        // state[led.id] değiştirilmiyor → son bilinen durum korunur
      }
    }));
    saveToStorage();
    renderCards();
  }

  async function toggle(led) {
    const action = state[led.id] ? 'off' : 'on';
    const card = document.getElementById('card-' + led.id);
    if (card) card.classList.add('loading');

    try {
      await fetchWithTimeout(`http://${led.host}/led1/${action}`, FETCH_TIMEOUT_MS);
      state[led.id] = !state[led.id];
      networkStatus[led.id] = true;
      saveToStorage();
      renderCards();
      showToast(`${led.name} ${state[led.id] ? 'açıldı' : 'kapatıldı'}`, 'success');
    } catch {
      showToast(`${led.name} — Bağlantı hatası`, 'error');
      networkStatus[led.id] = false;
      renderCards();
    }
  }

  async function allLeds(action) {
    await Promise.all(LEDS.map(led =>
      fetchWithTimeout(`http://${led.host}/led1/${action}`, FETCH_TIMEOUT_MS)
        .then(() => {
          state[led.id] = action === 'on';
          networkStatus[led.id] = true;
        })
        .catch(() => {
          networkStatus[led.id] = false;
        })
    ));
    saveToStorage();
    renderCards();
    showToast(action === 'on' ? 'Tüm odalar açıldı' : 'Tüm odalar kapatıldı', 'success');
  }

  // ===== UZUN BASMA / ZORLA AÇ-KAPAT =====
  function endHold() {
    clearTimeout(holdTimer);
    holdTimer = null;
    if (holdCard) holdCard.classList.remove('pressing');
    holdCard = null;
    isHolding = false;
    if (pendingRender) renderCards();
  }

  function openForceMenu(led) {
    forceTarget = led;
    document.getElementById('forceTitle').textContent = `${led.icon} ${led.name}`;
    document.getElementById('forceOverlay').classList.add('show');
  }

  function closeForceMenu() {
    document.getElementById('forceOverlay').classList.remove('show');
    forceTarget = null;
  }

  // Mevcut durumu kontrol etmeden, toplam 5 saniye boyunca komutu tekrar dener.
  // Her deneme aynı aç/kapat komutunu gönderir; cihaz cevap verirse durur.
  async function forceSet(action) {
    const led = forceTarget;
    if (!led) return;
    closeForceMenu();

    const url = `http://${led.host}/led1/${action}`;
    const deadline = Date.now() + 5000;
    let lastError = null;

    while (Date.now() < deadline) {
      const remaining = deadline - Date.now();
      try {
        // Bir denemenin tüm süreyi tüketmesini önle; kalan 5 sn içinde yeniden dene.
        await fetchWithTimeout(url, Math.min(1200, remaining));
        state[led.id] = (action === 'on');
        networkStatus[led.id] = true;
        saveToStorage();
        renderCards();
        showToast(`${led.name} zorla ${action === 'on' ? 'açıldı' : 'kapatıldı'}`, 'success');
        return;
      } catch (err) {
        lastError = err;
        const waitMs = Math.min(250, deadline - Date.now());
        if (waitMs > 0) await new Promise(resolve => setTimeout(resolve, waitMs));
      }
    }

    networkStatus[led.id] = false;
    renderCards();
    showToast(`${led.name} — 5 saniye denendi, bağlantı kurulamadı`, 'error');
  }

  // Karartılmış alana dokununca menüyü kapat
  document.getElementById('forceOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'forceOverlay') closeForceMenu();
  });

  // Event delegation: kartlar yeniden çizilse bile çalışır
  const gridEl = document.getElementById('ledGrid');

  gridEl.addEventListener('pointerdown', (e) => {
    const card = e.target.closest('.led-card');
    if (!card) return;
    const led = LEDS.find(l => 'card-' + l.id === card.id);
    if (!led) return;

    isHolding = true;
    holdFired = false;
    holdCard = card;
    holdLed = led;
    startX = e.clientX;
    startY = e.clientY;

    card.classList.add('pressing');

    holdTimer = setTimeout(() => {
      holdFired = true;
      if (navigator.vibrate) navigator.vibrate(40); // Android'de titreşim
      endHold();
      openForceMenu(led);
    }, HOLD_MS);
  });

  gridEl.addEventListener('pointermove', (e) => {
    if (!isHolding) return;
    if (Math.abs(e.clientX - startX) > MOVE_TOLERANCE ||
        Math.abs(e.clientY - startY) > MOVE_TOLERANCE) {
      holdLed = null;       // kayma = iptal, toggle de yapma
      endHold();
    }
  });

  gridEl.addEventListener('pointerup', () => {
    if (!isHolding) return;       // zaten tetiklendi veya iptal edildi
    const led = holdLed;
    const fired = holdFired;
    endHold();
    if (!fired && led) toggle(led); // 2 sn dolmadan bırakıldı → normal toggle
  });

  gridEl.addEventListener('pointercancel', () => { holdLed = null; endHold(); });
  gridEl.addEventListener('pointerleave',  () => { if (isHolding) { holdLed = null; endHold(); } });

  // Uzun basışta çıkan sistem menüsünü engelle
  gridEl.addEventListener('contextmenu', (e) => e.preventDefault());
  gridEl.addEventListener('selectstart', (e) => e.preventDefault());
  gridEl.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });

  let toastTimer;
  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = 'toast'; }, 2400);
  }

  // Service Worker kaydı
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js?v=3');
  }

  // İlk yükleme
  updateClockAndUI();
  setInterval(updateClockAndUI, 1000);

  renderCards(); // localStorage'daki durumu hemen göster
  checkAllStatuses(); // ardından ağdan gerçek durumu çek

  // Her 5 saniyede otomatik kontrol
  setInterval(checkAllStatuses, 5000);

  // Arka plandan geri dönünce (iOS için kritik)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      updateClockAndUI();
      checkAllStatuses();
    }
  });

  // iOS PWA: sayfa focus'u alınca da kontrol et
  window.addEventListener('focus', () => {
    checkAllStatuses();
  });

  // iOS PWA: pageshow eventi (cache'den restore edilince tetiklenir)
  window.addEventListener('pageshow', (e) => {
    if (e.persisted) {
      updateClockAndUI();
      checkAllStatuses();
    }
  });
</script>
</body>
</html>
