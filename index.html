<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070709">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Akıllı Ev">
  <title>Akıllı Ev</title>
  <link rel="apple-touch-icon" href="https://github.com/HamzaEymen61/foto/raw/main/icon-192.png">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    :root {
      --bg-base: #07070a;
      --glass-surface: rgba(255, 255, 255, 0.045);
      --glass-surface-active: rgba(255, 255, 255, 0.11);
      --glass-border: rgba(255, 255, 255, 0.09);
      --glass-border-highlight: rgba(255, 255, 255, 0.28);
      --glass-border-active: rgba(255, 255, 255, 0.35);
      --text-primary: #ffffff;
      --text-secondary: rgba(235, 235, 245, 0.6);
      --text-tertiary: rgba(235, 235, 245, 0.35);
      --warm-glow: rgba(255, 214, 138, 0.22);
    }

    html, body {
      height: 100%;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: flex;
      justify-content: center;
      position: relative;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* Arka Plan Ambiyans Işıkları (Liquid Glass derinliği için) */
    .ambient-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 0%, #141622 0%, #07070a 75%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(75px);
      opacity: 0.55;
      animation: floatOrb 18s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(88, 124, 255, 0.26), transparent 70%);
      top: -60px;
      left: -40px;
    }

    .orb-2 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(168, 110, 255, 0.18), transparent 70%);
      bottom: 8%;
      right: -70px;
      animation-delay: -6s;
    }

    .orb-3 {
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(255, 195, 113, 0.12), transparent 70%);
      top: 42%;
      left: 20%;
      animation-delay: -12s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(22px, -28px) scale(1.08); }
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      padding: 18px 22px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Üst Saat ve Selamlama Alanı */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-top: 10px;
      flex-shrink: 0;
    }

    .live-time {
      font-size: 56px;
      font-weight: 200;
      letter-spacing: -2px;
      line-height: 0.98;
      background: linear-gradient(180deg, #ffffff 35%, rgba(255, 255, 255, 0.68) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-variant-numeric: tabular-nums;
    }

    .greeting-pill {
      margin-top: 10px;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .greeting-text {
      font-size: 13px;
      font-weight: 500;
      color: #ffffff;
      letter-spacing: -0.1px;
    }

    .live-date {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-secondary);
      margin-top: 7px;
      text-transform: capitalize;
    }

    /* Ana Oda Kartları Alanı */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      margin: 10px 0;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--text-tertiary);
    }

    .active-count {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    /* Liquid Glass Kart Tasarımı */
    .led-card {
      position: relative;
      height: 124px;
      border-radius: 26px;
      padding: 18px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      overflow: hidden;
      touch-action: manipulation;

      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.07) 0%,
        rgba(255, 255, 255, 0.025) 100%
      );
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-top-color: rgba(255, 255, 255, 0.22);
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.35),
        inset 0 1px 1px rgba(255, 255, 255, 0.16);
      transition:
        transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
        background 0.35s ease,
        border-color 0.35s ease,
        box-shadow 0.35s ease,
        opacity 0.3s ease;
    }

    /* Cam üstü sıvı ışık parlaması */
    .led-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle at 20% 0%,
        rgba(255, 255, 255, 0.14) 0%,
        transparent 60%
      );
      opacity: 0.6;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    /* Uzun basma ilerleme çubuğu */
    .led-card::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      height: 3px;
      width: 0;
      background: linear-gradient(90deg, rgba(255,255,255,0.4), #ffffff);
      border-radius: 0 4px 4px 0;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    .led-card.pressing {
      transform: scale(0.955);
    }

    .led-card.pressing::after {
      width: 100%;
      transition: width 1s linear;
    }

    .led-card * {
      pointer-events: none;
    }

    /* Kart AÇIK (ON) Durumu - Sıvı Cam İçten Aydınlanma */
    .led-card.on {
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.18) 0%,
        rgba(255, 240, 210, 0.08) 100%
      );
      border-color: var(--glass-border-active);
      border-top-color: rgba(255, 255, 255, 0.55);
      box-shadow:
        0 14px 34px rgba(0, 0, 0, 0.42),
        0 0 28px var(--warm-glow),
        inset 0 1px 1px rgba(255, 255, 255, 0.45);
    }

    .led-card.on::before {
      opacity: 1;
      background: radial-gradient(
        circle at 25% 15%,
        rgba(255, 244, 220, 0.28) 0%,
        transparent 65%
      );
    }

    /* Çevrimdışı Durumları */
    .led-card.on.offline {
      opacity: 0.55;
      box-shadow: none;
    }

    .led-card.offline {
      opacity: 0.38;
    }

    .led-card.loading {
      opacity: 0.5;
      pointer-events: none;
    }

    .led-card-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1;
    }

    /* İkon Cam Kapsülü */
    .icon-bubble {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.35s ease;
    }

    .led-card.on .icon-bubble {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow:
        0 4px 14px rgba(255, 224, 160, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    .led-icon {
      font-size: 21px;
      line-height: 1;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .led-card.on .led-icon {
      transform: scale(1.08);
    }

    .top-right-indicators {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .offline-badge {
      font-size: 11px;
      opacity: 0.8;
      display: none;
    }

    .led-card.offline .offline-badge {
      display: inline-block;
    }

    .led-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
      transition: all 0.3s ease;
    }

    .led-card.on:not(.offline) .led-status-dot {
      background: #ffffff;
      box-shadow: 0 0 10px #ffffff, 0 0 18px rgba(255, 230, 170, 0.9);
    }

    .led-card-bottom {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      z-index: 1;
    }

    .led-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: -0.25px;
      transition: color 0.3s ease;
    }

    .led-card.on .led-name {
      color: #ffffff;
    }

    .led-status-text {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-tertiary);
      margin-top: 2px;
      transition: color 0.3s ease;
    }

    .led-card.on .led-status-text {
      color: rgba(255, 255, 255, 0.85);
      font-weight: 500;
    }

    /* Alt Merkezi Senaryo Butonları (Liquid Glass Pill) */
    .footer-controls {
      flex-shrink: 0;
    }

    .all-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .all-btn {
      position: relative;
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.08) 0%,
        rgba(255, 255, 255, 0.03) 100%
      );
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-top-color: rgba(255, 255, 255, 0.24);
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
      border-radius: 22px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      padding: 16px 12px;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      touch-action: manipulation;
    }

    .all-btn:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.14);
    }

    /* Dinamik Ada (Dynamic Island) Tarzı Bildirim */
    .toast {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%) translateY(-90px) scale(0.9);
      background: rgba(18, 18, 22, 0.82);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-top-color: rgba(255, 255, 255, 0.3);
      border-radius: 999px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 500;
      padding: 10px 20px;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s;
      opacity: 0;
      z-index: 120;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      white-space: nowrap;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0) scale(1);
      opacity: 1;
    }

    .toast.error {
      border-color: rgba(255, 107, 107, 0.4);
      color: #ff8585;
    }

    /* Apple Tarzı Liquid Glass Alt Menü (Action Sheet) */
    .force-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
      z-index: 100;
    }

    .force-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .force-sheet {
      position: fixed;
      left: 50%;
      bottom: calc(12px + env(safe-area-inset-bottom));
      width: calc(100% - 24px);
      max-width: 406px;
      transform: translate(-50%, 115%);
      background: linear-gradient(
        165deg,
        rgba(38, 38, 46, 0.78) 0%,
        rgba(20, 20, 25, 0.88) 100%
      );
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-top-color: rgba(255, 255, 255, 0.34);
      border-radius: 32px;
      padding: 14px 18px 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
      transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 101;
    }

    .force-overlay.show .force-sheet {
      transform: translate(-50%, 0);
    }

    .sheet-grabber {
      width: 36px;
      height: 4px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.25);
      margin: 0 auto 14px;
    }

    .force-title {
      font-size: 17px;
      font-weight: 600;
      text-align: center;
      letter-spacing: -0.2px;
    }

    .force-sub {
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
      margin: 4px 0 18px;
    }

    .force-btn {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-top-color: rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-size: 15px;
      font-weight: 500;
      padding: 15px;
      border-radius: 18px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .force-btn:active {
      transform: scale(0.97);
    }

    .force-btn.on {
      background: rgba(255, 255, 255, 0.15);
    }

    .force-btn.off {
      background: rgba(255, 69, 58, 0.14);
      border-color: rgba(255, 69, 58, 0.28);
      color: #ff6961;
    }

    .force-btn.cancel {
      background: rgba(255, 255, 255, 0.04);
      border-color: transparent;
      color: var(--text-secondary);
      margin-bottom: 0;
    }

    /* Küçük ekranlar için otomatik uyum */
    @media (max-height: 700px) {
      .live-time { font-size: 44px; }
      .led-card { height: 106px; padding: 14px; border-radius: 22px; }
      .icon-bubble { width: 34px; height: 34px; border-radius: 11px; }
      .led-icon { font-size: 18px; }
      .grid { gap: 10px; }
      .all-btn { padding: 13px 10px; }
    }
  </style>
</head>
<body>

<div class="ambient-bg">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="app">
  <header>
    <div class="live-time" id="liveTime">22:36</div>
    <div class="greeting-pill">
      <span class="greeting-text" id="greetingText">İyi Geceler</span>
    </div>
    <div class="live-date" id="liveDate">18 Kasım Çarşamba</div>
  </header>

  <div class="main-content">
    <div class="section-header">
      <span class="section-label">Odalar</span>
      <span class="active-count" id="activeCount">0 açık</span>
    </div>
    <div class="grid" id="ledGrid"></div>
  </div>

  <div class="footer-controls">
    <div class="section-header">
      <span class="section-label">Merkezi Senaryolar</span>
    </div>
    <div class="all-controls">
      <button class="all-btn" onclick="allLeds('on')">✦ Tümünü Aç</button>
      <button class="all-btn" onclick="allLeds('off')">✕ Tümünü Kapat</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="force-overlay" id="forceOverlay">
  <div class="force-sheet">
    <div class="sheet-grabber"></div>
    <div class="force-title" id="forceTitle">Oda</div>
    <div class="force-sub">Mevcut durum yok sayılarak doğrudan komut gönderilir</div>
    <button class="force-btn on" onclick="forceSet('on')">⚡ Zorla Aç</button>
    <button class="force-btn off" onclick="forceSet('off')">⛔ Zorla Kapat</button>
    <button class="force-btn cancel" onclick="closeForceMenu()">Vazgeç</button>
  </div>
</div>

<script>
  const LEDS = [
    { id: 'led1', name: 'Hamza Oda',   host: 'hamza-oda.local',   icon: '🛏️' },
    { id: 'led2', name: 'Salon',       host: 'salon.local',       icon: '🛋️' },
    { id: 'led3', name: 'Mutfak',      host: 'mutfak.local',      icon: '🍽️' },
    { id: 'led4', name: 'Ravza Oda',   host: 'ravza-oda.local',   icon: '🌸' },
    { id: 'led5', name: 'Yatak Odası', host: 'yatak-odasi.local', icon: '🌙' },
  ];

  const FETCH_TIMEOUT_MS = 3000;
  const state = {};
  const networkStatus = {};

  function loadStoredState() {
    try {
      return JSON.parse(localStorage.getItem('smarthome_state')) || {};
    } catch (e) {
      return {};
    }
  }

  const savedState = loadStoredState();
  LEDS.forEach(l => {
    state[l.id] = savedState[l.id] !== undefined ? savedState[l.id] : false;
    networkStatus[l.id] = null;
  });

  function saveToStorage() {
    try {
      localStorage.setItem('smarthome_state', JSON.stringify(state));
    } catch (e) {}
  }

  function fetchWithTimeout(url, timeoutMs) {
    return new Promise((resolve, reject) => {
      const controller = new AbortController();
      const timer = setTimeout(() => {
        controller.abort();
        reject(new Error('timeout'));
      }, timeoutMs);

      fetch(url, { signal: controller.signal })
        .then(res => { clearTimeout(timer); resolve(res); })
        .catch(err => { clearTimeout(timer); reject(err); });
    });
  }

  function updateClockAndUI() {
    const now = new Date();
    const hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('liveTime').textContent = `${String(hours).padStart(2, '0')}:${minutes}`;

    const options = { day: 'numeric', month: 'long', weekday: 'long' };
    document.getElementById('liveDate').textContent = now.toLocaleDateString('tr-TR', options);

    let greeting = 'İyi Geceler';
    if (hours >= 5 && hours < 12) greeting = 'Günaydın';
    else if (hours >= 12 && hours < 17) greeting = 'Tünaydın';
    else if (hours >= 17 && hours < 22) greeting = 'İyi Akşamlar';
    document.getElementById('greetingText').textContent = greeting;
  }

  const HOLD_MS = 1000;
  const MOVE_TOLERANCE = 14;

  let isHolding = false;
  let pendingRender = false;
  let holdTimer = null;
  let holdFired = false;
  let holdCard = null;
  let holdLed = null;
  let startX = 0, startY = 0;
  let forceTarget = null;

  function renderCards() {
    if (isHolding) { pendingRender = true; return; }
    pendingRender = false;

    const activeTotal = LEDS.filter(l => state[l.id]).length;
    document.getElementById('activeCount').textContent =
      activeTotal > 0 ? `${activeTotal} oda açık` : 'Tümü kapalı';

    const grid = document.getElementById('ledGrid');
    grid.innerHTML = '';
    LEDS.forEach(led => {
      const isOn = state[led.id];
      const isOnline = networkStatus[led.id];
      const isOffline = isOnline === false;

      const card = document.createElement('div');
      let cls = 'led-card';
      if (isOn) cls += ' on';
      if (isOffline) cls += ' offline';
      card.className = cls;
      card.id = 'card-' + led.id;

      let statusText;
      if (isOffline) {
        statusText = isOn ? 'Açık · Çevrimdışı' : 'Ulaşılamıyor';
      } else {
        statusText = isOn ? 'Açık' : 'Kapalı';
      }

      card.innerHTML = `
        <div class="led-card-top">
          <div class="icon-bubble">
            <span class="led-icon">${led.icon}</span>
          </div>
          <div class="top-right-indicators">
            <span class="offline-badge">⚠️</span>
            <div class="led-status-dot"></div>
          </div>
        </div>
        <div class="led-card-bottom">
          <div class="led-name">${led.name}</div>
          <div class="led-status-text">${statusText}</div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  async function checkAllStatuses() {
    await Promise.all(LEDS.map(async (led) => {
      try {
        const res = await fetchWithTimeout(`http://${led.host}/status`, FETCH_TIMEOUT_MS);
        const data = await res.json();
        state[led.id] = data.status === 'on';
        networkStatus[led.id] = true;
      } catch {
        networkStatus[led.id] = false;
      }
    }));
    saveToStorage();
    renderCards();
  }

  async function toggle(led) {
    const action = state[led.id] ? 'off' : 'on';
    const card = document.getElementById('card-' + led.id);
    if (card) card.classList.add('loading');

    try {
      await fetchWithTimeout(`http://${led.host}/led1/${action}`, FETCH_TIMEOUT_MS);
      state[led.id] = !state[led.id];
      networkStatus[led.id] = true;
      saveToStorage();
      renderCards();
      showToast(`${led.name} ${state[led.id] ? 'açıldı' : 'kapatıldı'}`, 'success');
    } catch {
      showToast(`${led.name} — Bağlantı hatası`, 'error');
      networkStatus[led.id] = false;
      renderCards();
    }
  }

  async function allLeds(action) {
    await Promise.all(LEDS.map(led =>
      fetchWithTimeout(`http://${led.host}/led1/${action}`, FETCH_TIMEOUT_MS)
        .then(() => {
          state[led.id] = action === 'on';
          networkStatus[led.id] = true;
        })
        .catch(() => {
          networkStatus[led.id] = false;
        })
    ));
    saveToStorage();
    renderCards();
    showToast(action === 'on' ? 'Tüm odalar açıldı' : 'Tüm odalar kapatıldı', 'success');
  }

  function endHold() {
    clearTimeout(holdTimer);
    holdTimer = null;
    if (holdCard) holdCard.classList.remove('pressing');
    holdCard = null;
    isHolding = false;
    if (pendingRender) renderCards();
  }

  function openForceMenu(led) {
    forceTarget = led;
    document.getElementById('forceTitle').textContent = `${led.icon} ${led.name}`;
    document.getElementById('forceOverlay').classList.add('show');
  }

  function closeForceMenu() {
    document.getElementById('forceOverlay').classList.remove('show');
    forceTarget = null;
  }

  async function forceSet(action) {
    const led = forceTarget;
    if (!led) return;
    closeForceMenu();

    const url = `http://${led.host}/led1/${action}`;
    const deadline = Date.now() + 5000;

    while (Date.now() < deadline) {
      const remaining = deadline - Date.now();
      try {
        await fetchWithTimeout(url, Math.min(1200, remaining));
        state[led.id] = (action === 'on');
        networkStatus[led.id] = true;
        saveToStorage();
        renderCards();
        showToast(`${led.name} zorla ${action === 'on' ? 'açıldı' : 'kapatıldı'}`, 'success');
        return;
      } catch {
        const waitMs = Math.min(250, deadline - Date.now());
        if (waitMs > 0) await new Promise(resolve => setTimeout(resolve, waitMs));
      }
    }

    networkStatus[led.id] = false;
    renderCards();
    showToast(`${led.name} — 5 sn denendi, ulaşılamadı`, 'error');
  }

  document.getElementById('forceOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'forceOverlay') closeForceMenu();
  });

  const gridEl = document.getElementById('ledGrid');

  function handleStart(x, y, target) {
    const card = target.closest('.led-card');
    if (!card) return;
    const led = LEDS.find(l => 'card-' + l.id === card.id);
    if (!led) return;

    isHolding = true;
    holdFired = false;
    holdCard = card;
    holdLed = led;
    startX = x;
    startY = y;

    card.classList.add('pressing');

    holdTimer = setTimeout(() => {
      holdFired = true;
      if (navigator.vibrate) navigator.vibrate(40);
      endHold();
      openForceMenu(led);
    }, HOLD_MS);
  }

  function handleMove(x, y) {
    if (!isHolding) return;
    if (Math.abs(x - startX) > MOVE_TOLERANCE || Math.abs(y - startY) > MOVE_TOLERANCE) {
      holdLed = null;
      endHold();
    }
  }

  function handleEnd() {
    if (!isHolding) return;
    const led = holdLed;
    const fired = holdFired;
    endHold();
    if (!fired && led) toggle(led);
  }

  gridEl.addEventListener('touchstart', (e) => {
    if (e.touches.length > 1) return;
    const t = e.touches[0];
    handleStart(t.clientX, t.clientY, e.target);
  }, { passive: true });

  gridEl.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    handleMove(t.clientX, t.clientY);
  }, { passive: true });

  gridEl.addEventListener('touchend', (e) => {
    if (isHolding) {
      e.preventDefault();
      handleEnd();
    }
  });

  gridEl.addEventListener('touchcancel', () => {
    holdLed = null;
    endHold();
  });

  gridEl.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    handleStart(e.clientX, e.clientY, e.target);
  });

  window.addEventListener('mousemove', (e) => {
    if (isHolding) handleMove(e.clientX, e.clientY);
  });

  window.addEventListener('mouseup', () => {
    if (isHolding) handleEnd();
  });

  gridEl.addEventListener('contextmenu', (e) => e.preventDefault());

  let toastTimer;
  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = 'toast'; }, 2400);
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js?v=3');
  }

  updateClockAndUI();
  setInterval(updateClockAndUI, 1000);

  renderCards();
  checkAllStatuses();
  setInterval(checkAllStatuses, 5000);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      updateClockAndUI();
      checkAllStatuses();
    }
  });

  window.addEventListener('focus', () => checkAllStatuses());
  window.addEventListener('pageshow', (e) => {
    if (e.persisted) {
      updateClockAndUI();
      checkAllStatuses();
    }
  });
</script>
</body>
</html>
